<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1b1026">
<title>$GODOT_PROJECT_NAME</title>
<!-- Deck of Fools' loading page: the key art poster with the logo, and a gold progress bar
     where the game's own title screen (ui/title_screen.gd) puts its Enter button, so the
     hand-over is seamless. Positions follow the game's stage: 640x360 units scaled to fit
     the screen (stretch "expand"), kept in sync by --s and --ox below. poster.webp and
     outfit.woff2 are copied next to this page by tools/export_web.ps1. -->
<link rel="preload" href="poster.webp" as="image">
<link rel="preload" href="outfit.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
	font-family: 'Outfit';
	src: url('outfit.woff2') format('woff2');
	font-weight: 100 900;
	font-display: block;
}
:root { --s: 1px; --ox: 0px; }
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body {
	color: #f3ead8;
	background-color: #1b1026;
	overflow: hidden;
	touch-action: none;
	font-family: 'Outfit', system-ui, sans-serif;
	-webkit-font-smoothing: antialiased;
}
#canvas { display: block; }
#canvas:focus { outline: none; }

#status {
	position: fixed;
	inset: 0;
	overflow: hidden;
	background: #1b1026 url('poster.webp') center / cover no-repeat;
	transition: opacity 420ms cubic-bezier(0.23, 1, 0.32, 1);
	z-index: 2;
}
#status.gone { opacity: 0; pointer-events: none; }
/* The same scrims the title screen paints: dark behind the logo on the left, and at the foot. */
#status::before {
	content: '';
	position: absolute;
	inset: 0;
	background:
		linear-gradient(90deg, rgba(20, 11, 30, 0.9) 0%, rgba(20, 11, 30, 0.55) 34%, rgba(20, 11, 30, 0) 58%),
		linear-gradient(0deg, rgba(20, 11, 30, 0.75) 0%, rgba(20, 11, 30, 0) 30%);
}
.logo, .tagline, .loader, #status-notice { position: absolute; }
.logo {
	left: calc(var(--ox) + 34 * var(--s));
	top: calc(92 * var(--s));
	margin: 0;
	font-weight: 800;
	font-size: calc(58 * var(--s));
	line-height: 0.92;
	letter-spacing: -0.01em;
	color: #f0b84a;
	-webkit-text-stroke: calc(4 * var(--s)) #140b1e;
	paint-order: stroke fill;
	text-shadow: 0 calc(4 * var(--s)) 0 rgba(0, 0, 0, 0.5);
}
.tagline {
	left: calc(var(--ox) + 36 * var(--s));
	top: calc(208 * var(--s));
	margin: 0;
	font-weight: 600;
	font-size: calc(14 * var(--s));
	color: #f3ead8;
	text-shadow: 0 calc(1 * var(--s)) calc(3 * var(--s)) rgba(0, 0, 0, 0.8);
}
.loader {
	left: calc(var(--ox) + 36 * var(--s));
	top: calc(246 * var(--s));
	width: calc(176 * var(--s));
}
.bar {
	height: calc(6 * var(--s));
	border-radius: calc(3 * var(--s));
	background: rgba(20, 11, 30, 0.8);
	box-shadow: inset 0 0 0 calc(1 * var(--s)) rgba(240, 184, 74, 0.35);
	overflow: hidden;
}
.fill {
	height: 100%;
	width: 100%;
	transform-origin: left center;
	transform: scaleX(0.02);
	background: linear-gradient(90deg, #c8962a, #f0b84a 70%, #ffe2a0);
	transition: transform 240ms cubic-bezier(0.23, 1, 0.32, 1);
}
.loader p {
	margin: calc(7 * var(--s)) 0 0;
	font-weight: 500;
	font-size: calc(10 * var(--s));
	color: #a99bbd;
	font-variant-numeric: tabular-nums;
}
#status-notice {
	display: none;
	left: calc(var(--ox) + 36 * var(--s));
	top: calc(246 * var(--s));
	max-width: calc(300 * var(--s));
	padding: calc(8 * var(--s)) calc(10 * var(--s));
	border-radius: calc(4 * var(--s));
	background: rgba(91, 57, 67, 0.92);
	border: 1px solid #9b3943;
	color: #f3ead8;
	font-size: calc(10 * var(--s));
	line-height: 1.35;
}
@media (prefers-reduced-motion: reduce) {
	#status, .fill { transition: none; }
}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>Deck of Fools needs JavaScript to run.</noscript>

<div id="status">
	<h1 class="logo">DECK<br>OF FOOLS</h1>
	<p class="tagline">A troupe of Jesters against the house</p>
	<div class="loader" id="status-progress">
		<div class="bar"><div class="fill" id="status-fill"></div></div>
		<p id="status-text">Raising the curtain</p>
	</div>
	<div id="status-notice"></div>
</div>

<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const root = document.documentElement;
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusFill = document.getElementById('status-fill');
	const statusText = document.getElementById('status-text');
	const statusNotice = document.getElementById('status-notice');

	// The game's stage: 640x360 units scaled to fit, centred (as Godot's "expand" stretch).
	function fitStage() {
		const s = Math.min(window.innerWidth / 640, window.innerHeight / 360);
		root.style.setProperty('--s', s + 'px');
		root.style.setProperty('--ox', ((window.innerWidth - 640 * s) / 2) + 'px');
	}
	fitStage();
	window.addEventListener('resize', fitStage);

	function setProgress(current, total) {
		if (current > 0 && total > 0) {
			const share = Math.min(1, current / total);
			statusFill.style.transform = 'scaleX(' + Math.max(0.02, share) + ')';
			statusText.textContent = 'Raising the curtain  ' + Math.round(share * 100) + '%';
		}
	}

	function showNotice(text) {
		statusProgress.style.display = 'none';
		statusNotice.textContent = '';
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
		statusNotice.style.display = 'block';
	}

	function fail(err) {
		console.error(err);
		showNotice(err instanceof Error ? err.message : (typeof err === 'string' ? err : 'Something went wrong while loading.'));
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('This browser can\'t run the game:\n' + missing.join('\n'));
		return;
	}
	engine.startGame({ onProgress: setProgress }).then(() => {
		statusFill.style.transform = 'scaleX(1)';
		statusText.textContent = 'Raising the curtain  100%';
		// The game's title screen draws this same poster; give it a few frames, then fade over.
		setTimeout(() => {
			statusOverlay.classList.add('gone');
			setTimeout(() => statusOverlay.remove(), 600);
		}, 350);
	}, fail);
}());
</script>
</body>
</html>
